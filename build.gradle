plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.udea'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// API REST (incluye Tomcat embebido y Jackson)
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
}

sourceSets {
	test {
		resources {
			srcDir file('src/test/java')
			exclude '**/*.java'
		}
	}
}

// Solo se genera el jar ejecutable (bootJar), no el "-plain.jar"
tasks.named('jar') {
	enabled = false
}

// Unit tests: excluye acceptance (Karate) y pruebas de rendimiento
test {
	useJUnitPlatform {
		excludeTags 'performance'
	}
	exclude 'acceptance/**'
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required.set(true)
		csv.required.set(false)
		html.required.set(true)
	}
}

// Pruebas de rendimiento (@Tag("performance"))
tasks.register('performanceTest', Test) {
	description = 'Corre las pruebas de rendimiento'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'performance'
	}
	exclude 'acceptance/**'
	outputs.upToDateWhen { false }
}

// Acceptance tests con Karate contra la API levantada en karate.baseUrl
tasks.register('acceptanceTest', Test) {
	description = 'Corre los acceptance tests con Karate'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include 'acceptance/**'
	systemProperty 'karate.baseUrl', System.getProperty('karate.baseUrl', 'http://localhost:8080')
	outputs.upToDateWhen { false }
}

// SonarCloud
sonar {
	properties {
		property 'sonar.organization', 'juandagonzalez17'
		property 'sonar.projectKey', 'JuanDaGonzalez17_Conversor---Calidad'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}
