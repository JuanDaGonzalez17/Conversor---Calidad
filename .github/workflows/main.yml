name: CI/CD Conversor

on:
  push:
    branches: [ main ]        # trunk
  pull_request:
    branches: [ main ]

# Pipeline por etapas:
#   Pruebas unitarias ──┬── Análisis estático
#                       ├── Pruebas de rendimiento
#                       └── Build ── Pruebas de aceptación

jobs:
  # ---------------------------------------------------------------
  # 1. Pruebas unitarias + cobertura
  # ---------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #6.4.0

      - name: Permisos a gradlew
        run: chmod +x gradlew

      - name: Unit tests y cobertura
        run: ./gradlew test jacocoTestReport

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: build/reports/jacoco/test

      - name: Subir reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-unit-tests
          path: build/reports/tests/test

  # ---------------------------------------------------------------
  # 2. Análisis estático en SonarCloud
  # ---------------------------------------------------------------
  static-analysis:
    name: Análisis estático
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # necesario para SonarCloud

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #6.4.0

      - name: Permisos a gradlew
        run: chmod +x gradlew

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-jacoco
          path: build/reports/jacoco/test

      - name: Compilar y analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew compileJava compileTestJava sonar

  # ---------------------------------------------------------------
  # 3. Pruebas de rendimiento
  # ---------------------------------------------------------------
  performance-tests:
    name: Pruebas de rendimiento
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #6.4.0

      - name: Permisos a gradlew
        run: chmod +x gradlew

      - name: Pruebas de rendimiento
        run: ./gradlew performanceTest

  # ---------------------------------------------------------------
  # 4. Build: genera el artefacto
  # ---------------------------------------------------------------
  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #6.4.0

      - name: Permisos a gradlew
        run: chmod +x gradlew

      - name: Generar jar
        run: ./gradlew bootJar

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  # ---------------------------------------------------------------
  # 5. Pruebas de aceptación con Karate contra el artefacto generado
  # ---------------------------------------------------------------
  acceptance-tests:
    name: Pruebas de aceptación
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #6.4.0

      - name: Permisos a gradlew
        run: chmod +x gradlew

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artefacto

      - name: Levantar API
        run: |
          JAR=$(ls artefacto/*.jar | head -n 1)
          nohup java -jar "$JAR" > app.log 2>&1 &
          for i in {1..30}; do
            if curl -sf "http://localhost:8080/api/peso?origen=gramos&destino=libras&valor=0" > /dev/null; then
              echo "API arriba"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          cat app.log
          exit 1

      - name: Acceptance tests
        run: ./gradlew acceptanceTest -Dkarate.baseUrl=http://localhost:8080

      - name: Log de la aplicación
        if: failure()
        run: cat app.log || true

      - name: Subir reporte de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-karate
          path: build/karate-reports